<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurant — Banner & Menu</title>
<style>
  :root{--accent:#ff7a59;--dark:#2b2b2b}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--dark)}
  header{
    position:relative;
    height:54vh;
    min-height:360px;
    background-image:url('banner-restaurant.jpg');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,10,10,0.35), rgba(10,10,10,0.5));
  }
  header .hero{
    position:relative; z-index:1; text-align:center; padding:1rem;
  }
  nav{
    display:flex; gap:1rem; justify-content:center; padding:0.5rem 1rem;
    background:rgba(255,255,255,0.9); position:sticky; top:0; z-index:3;
  }
  nav a{color:var(--dark);text-decoration:none;font-weight:700;padding:0.4rem 0.7rem;border-radius:6px}
  nav a:hover{background:#f1f1f1}

  main{padding:1.25rem}
  .menu-grid{display:grid;grid-template-columns:1fr;gap:1rem}
  .menu-item{display:flex;gap:1rem;align-items:center;background:white;border-radius:10px;padding:0.75rem;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
  .menu-item img{width:96px;height:72px;object-fit:cover;border-radius:8px}

  footer{background:#111;color:white;padding:1rem;text-align:center;margin-top:1.25rem;border-top:4px solid var(--accent)}

  @media(min-width:700px){
    .menu-grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(min-width:1100px){
    .menu-grid{grid-template-columns:repeat(3,1fr)}
    header{height:46vh}
    nav{justify-content:flex-end;padding-right:2rem}
  }
</style>
</head>
<body>
  <nav>
    <a href="#home">Home</a>
    <a href="#menu">Menu</a>
    <a href="#reserve">Reserve</a>
    <a href="#contact">Contact</a>
  </nav>

  <header id="home">
    <div class="hero">
      <h1 style="margin:0;font-size:clamp(1.5rem,3vw,2.25rem)">La Bella Trattoria</h1>
      <p style="margin:.25rem 0 .5rem">Authentic Italian • Wood-fired pizzas • Cozy ambiance</p>
      <a href="#menu" style="background:var(--accent);color:white;padding:.5rem 1rem;border-radius:8px;text-decoration:none;font-weight:700">View Menu</a>
    </div>
  </header>

  <main class="container">
    <section id="menu">
      <h2>Our Menu</h2>
      <div class="menu-grid">
        <div class="menu-item">
          <img src="dish1.jpg" alt="">
          <div>
            <h4>Margherita Pizza</h4>
            <p>Tomato, Mozzarella, Basil</p>
            <strong>₹399</strong>
          </div>
        </div>
        <div class="menu-item">
          <img src="dish2.jpg" alt="">
          <div>
            <h4>Pasta Alfredo</h4>
            <p>Creamy garlic sauce</p>
            <strong>₹349</strong>
          </div>
        </div>
        <!-- more items -->
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 La Bella Trattoria • 123 Food Lane • Tel: 9999-999-999</p>
  </footer>
</body>
</html>
